<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anicée's Flashcards !</title>
<link rel="stylesheet" href="style.css?v=139">
</head>
<body>

<main>

  <!-- Scherm 1: vak kiezen -->
  <section id="schermVak" class="scherm actief">
    <h1 class="start-titel"><span id="titelDieren" class="titel-dieren"></span>Wat ga je oefenen?</h1>
    <div id="vakLijst"></div>
  </section>

  <!-- Scherm 2: hoofdstukken kiezen -->
  <section id="schermHoofdstuk" class="scherm">
    <button class="terug" onclick="toonScherm('schermVak')">← Vakken</button>
    <h2 id="vakTitel"></h2>
    <div class="hfst-kolommen">
      <!-- links: hoofdstukken -->
      <div class="kolom-links">
        <div id="hoofdstukLijst"></div>
        <label class="opties"><input type="checkbox" id="alles" onchange="vinkAlles(this.checked)"> Alles selecteren</label>
      </div>
      <!-- rechts: opties, start en scores -->
      <div class="kolom-rechts">
        <div class="filter">
          <div class="filter-titel">Welke kaarten wil je oefenen?</div>
          <label class="opties"><input type="checkbox" id="fNieuw" checked> Nog niet beantwoord</label>
          <label class="opties"><input type="checkbox" id="fFout" checked> Had ik eerder <span class="rood">fout</span></label>
          <label class="opties"><input type="checkbox" id="fJuist"> Had ik eerder <span class="groen">juist</span></label>
        </div>
        <div class="filter">
          <div class="filter-titel">Soort kaarten</div>
          <label class="opties"><input type="checkbox" name="oefKeuze" value="alles" checked> Alle kaarten</label>
          <label class="opties"><input type="checkbox" name="oefKeuze" value="enkel"> Enkel <span class="oef-woord">oefeningen</span></label>
          <label class="opties"><input type="checkbox" name="oefKeuze" value="fav"> <span>Enkel <span class="fav-woord"><svg class="mini-ster" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2l2.7 5.5 6 .9-4.35 4.25 1.03 6L12 17l-5.38 2.85 1.03-6L3.3 9.6l6-.9z"/></svg> favorieten</span> <span id="favAantal"></span></span></label>
        </div>
        <label class="opties"><input type="checkbox" id="schudden"> Kaarten schudden</label>
        <label class="opties lang" title="Een kaart die je fout hebt, komt na 6 kaarten terug. Heb je ze dan juist, dan nog één keer na 12 kaarten."><input type="checkbox" id="herhalen"> <span><span class="rood">Foute</span> kaarten herhalen tijdens het oefenen</span></label>
        <button onclick="startOefenen()">Start</button>
        <button class="licht" id="terugzetten" onclick="toonWeggegooid()"></button>
      </div>
    </div>
  </section>

  <!-- Scherm 3: oefenen -->
  <section id="schermOefenen" class="scherm">
   <div class="oefenKolom">
    <div class="bovenbalk">
      <span class="balk-links">
        <button class="terug" onclick="kiesVak(huidigVak)">← Stoppen</button>
        <span class="teller" id="teller"></span>
      </span>
      <span class="knoppen-rechts">
        <button class="klein ongedaan" onclick="maakOngedaan()" title="Ongedaan maken: laatste antwoord of weggegooide kaart terugzetten">↶<span class="knoptekst"> Ongedaan</span> <span class="toets">Z</span></button>
        <button class="klein" onclick="gooiWeg()" title="Weggooien">Weggooien <span class="toets">W</span></button>
      </span>
    </div>
    <!-- Stand van de gekozen hoofdstukken: links naast de kaart (breed scherm) of als balk boven de kaart -->
    <aside class="stand" id="stand"></aside>
    <div class="kaart" id="kaart" onclick="draaiOm()">
      <div class="binnen">
        <div class="kant voorkant">
          <div class="onderwerp" id="onderwerpVoor"></div>
          <button class="ster" type="button" onclick="wisselFavoriet(event)" title="Favoriet aan of uit (S)" aria-label="Favoriet"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2l2.7 5.5 6 .9-4.35 4.25 1.03 6L12 17l-5.38 2.85 1.03-6L3.3 9.6l6-.9z"/></svg></button>
          <div id="vraag"></div>
          <div class="kaart-fig" id="figVoor"></div>
          <div class="scroll-duim" aria-hidden="true"></div>
        </div>
        <div class="kant achterkant">
          <div class="onderwerp" id="onderwerpAchter"></div>
          <button class="ster" type="button" onclick="wisselFavoriet(event)" title="Favoriet aan of uit (S)" aria-label="Favoriet"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2l2.7 5.5 6 .9-4.35 4.25 1.03 6L12 17l-5.38 2.85 1.03-6L3.3 9.6l6-.9z"/></svg></button>
          <div id="antwoord"></div>
          <div class="kaart-fig" id="figAchter"></div>
          <div class="uitleg" id="uitleg"></div>
          <div class="scroll-duim" aria-hidden="true"></div>
        </div>
      </div>
    </div>
    <p class="hint" id="hint">Tik op de kaart of druk op spatie om het antwoord te zien</p>
    <div class="rij" id="antwoordKnoppen">
      <button class="fout" onclick="volgende(false)">✗ Wist ik niet <span class="toets">←</span></button>
      <button class="goed" onclick="volgende(true)">✓ Wist ik <span class="toets">→</span></button>
    </div>
   </div>

    <!-- Overzicht van de cursus (rechts, alleen op brede schermen) -->
    <aside class="overzicht" id="overzicht"></aside>
  </section>

  <!-- Scherm: weggegooide kaarten bekijken en terugzetten -->
  <section id="schermWeggegooid" class="scherm">
    <button class="terug" onclick="kiesVak(huidigVak)">← Terug</button>
    <h2>Weggegooide kaarten</h2>
    <div class="weg-kop">
      <p class="hint links">Vink aan wat je wil terugzetten.</p>
      <button class="licht klein" id="kopieerKnop" onclick="kopieerWegLijst()">Lijst kopiëren</button>
    </div>
    <div id="wegLijst"></div>
    <button id="wegKnop" onclick="zetGeselecteerdTerug()">Geselecteerde terugzetten</button>
  </section>

  <!-- Scherm 4: resultaat -->
  <section id="schermEinde" class="scherm">
    <h1 id="eindeTitel">Klaar!</h1>
    <div class="score" id="score"></div>
    <button class="licht ongedaan" onclick="maakOngedaan()">Laatste kaart ongedaan maken <span class="toets">Z</span></button>
    <button class="licht" id="terugHoofdstukken" onclick="kiesVak(huidigVak)">Terug naar de hoofdstukken</button>
    <button class="licht" onclick="toonScherm('schermVak')">Ander vak kiezen</button>
  </section>

</main>

<!-- 1. eerst de kaarten, 2. dan de app -->
